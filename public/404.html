<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found — Upright</title>
    <meta name="robots" content="noindex" />
    <style>
      :root {
        color-scheme: light;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background: #fff;
        color: #111827;
        font-family: ui-sans-serif, system-ui, sans-serif;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        border-bottom: 3px solid #000;
        padding: 0.75rem 1.25rem;
      }
      .brand {
        font-weight: 900;
        letter-spacing: 0.02em;
        text-transform: lowercase;
        color: inherit;
        text-decoration: none;
      }
      main {
        max-width: 32rem;
        margin: 0 auto;
        padding: 4rem 1.25rem;
        text-align: center;
      }
      .kicker {
        margin: 0;
        font-family: ui-monospace, monospace;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: rgb(17 24 39 / 0.55);
      }
      h1 {
        margin: 0.75rem 0 0;
        font-size: 2.5rem;
        line-height: 1;
        font-weight: 900;
        text-transform: uppercase;
      }
      p {
        margin: 1rem 0 0;
        font-size: 0.875rem;
        font-weight: 500;
        line-height: 1.6;
        color: rgb(17 24 39 / 0.7);
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.75rem;
        margin-top: 2rem;
      }
      a.btn {
        display: inline-block;
        border: 3px solid #000;
        padding: 0.75rem 1.25rem;
        font-size: 0.75rem;
        font-weight: 900;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        text-decoration: none;
        color: #111827;
        background: #fff;
        box-shadow: 4px 4px 0 0 #000;
      }
      a.btn.primary {
        background: #7c3aed;
        color: #fff;
        box-shadow: 6px 6px 0 0 #000;
      }
      nav a {
        margin-left: 0.75rem;
        font-size: 11px;
        font-weight: 900;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: rgb(17 24 39 / 0.7);
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <header>
      <a class="brand" href="/">upright</a>
      <nav aria-label="Site">
        <a href="/help">Help</a>
        <a href="/login">Log in</a>
      </nav>
    </header>
    <main>
      <p class="kicker">404</p>
      <h1>Page not found</h1>
      <p>
        That address is not part of Upright. Check the link, or head back to a
        page you know.
      </p>
      <div class="actions">
        <a class="btn primary" href="/">Home</a>
        <a class="btn" href="/login">Log in</a>
        <a class="btn" href="/help">Help</a>
      </div>
    </main>
  </body>
</html>
